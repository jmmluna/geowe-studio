<div class="feature-list-container">
  <style>
    .feature-list-container {
      padding: 10px;
      overflow-x: auto;
      max-width: 100%;
    }
    .fl-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    .fl-table th {
      background: #f0f4f8;
      border-bottom: 2px solid #cbd5e1;
      padding: 8px;
      text-align: left;
    }
    .fl-table td {
      border-bottom: 1px solid #e2e8f0;
      padding: 8px;
    }
    .fl-table tr:hover {
      background: #f8fafc;
    }
  </style>
  <div id="fl-content">
    {TABLE_PLACEHOLDER}
  </div>
</div>
