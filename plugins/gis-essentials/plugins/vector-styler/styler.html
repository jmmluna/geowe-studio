<div class="styler-container">
  <div class="styler-row">
    <span class="styler-label">Color de Relleno</span>
    <input type="color" id="fill-color" value="{{currentColor}}" class="geowe-ui-color-picker">
  </div>
  <div class="styler-row">
    <span class="styler-label">Color de Borde</span>
    <input type="color" id="stroke-color" value="#2980b9" class="geowe-ui-color-picker">
  </div>
  <div class="styler-row">
    <span class="styler-label">Grosor</span>
    <input type="range" id="stroke-width" min="1" max="10" value="2" style="flex: 1;">
  </div>
  <div style="margin-top: 10px; display: flex; justify-content: flex-end; gap: 10px;">
     <button id="cancel-styler" class="geowe-ui-btn geowe-ui-btn-secondary">Cancelar</button>
     <button id="apply-styler" class="geowe-ui-btn geowe-ui-btn-primary">Aplicar Cambios</button>
  </div>
</div>
